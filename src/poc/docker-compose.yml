version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: express-app
    ports:
      - "3333:3333"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - PORT=3333
      - NODE_ENV=development
      - DEBUG=true
    depends_on:
      - fluent-bit
    # ログドライバを fluentd にし、ポート 24224 に流す
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: app.logs

  fluent-bit:
    image: fluent/fluent-bit:1.9
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./logs:/logs
    ports:
      - "24224:24224"

volumes:
  logs:
